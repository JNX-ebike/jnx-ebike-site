<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNX EBIKE | Electric Two-Wheeler & Three-Wheeler Manufacturer</title>
  <meta name="description" content="Nanjing Juenengxing New Energy Technology Co., Ltd. — professional manufacturer and exporter of electric two-wheelers and three-wheelers. OEM/ODM customization, factory-direct prices.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <!-- ===== HERO ===== -->
    <section class="hero" style="padding:0">
      <div class="container hero-inner">
        <div class="hero-content">
          <span class="hero-badge"><span class="dot"></span><span data-i18n="hero.badge"></span></span>
          <h1><span data-i18n="hero.t1"></span><br><span class="accent" data-i18n="hero.t2"></span></h1>
          <p class="hero-lead" data-i18n="hero.desc"></p>
          <div class="hero-actions">
            <a href="products.html" class="btn btn-primary btn-lg" data-i18n="hero.cta1"></a>
            <a href="contact.html" class="btn btn-outline btn-lg" data-i18n="hero.cta2"></a>
          </div>
          <div class="hero-stats">
            <div class="stat"><div class="num" data-i18n="hero.s1n"></div><div class="label" data-i18n="hero.s1l"></div></div>
            <div class="stat"><div class="num" data-i18n="hero.s2n"></div><div class="label" data-i18n="hero.s2l"></div></div>
            <div class="stat"><div class="num" data-i18n="hero.s3n"></div><div class="label" data-i18n="hero.s3l"></div></div>
            <div class="stat"><div class="num" data-i18n="hero.s4n"></div><div class="label" data-i18n="hero.s4l"></div></div>
          </div>
        </div>
        <div class="hero-visual">
          <img src="images/products/tc_image7.jpg" alt="JNX Electric Three-Wheeler" class="hero-bike" style="object-fit:cover;border-radius:14px;aspect-ratio:4/3;transform:none">
          <div class="hero-float f1"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></span><span><span data-i18n="hero.f1"></span><small data-i18n="hero.f1s"></small></span></div>
          <div class="hero-float f2"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg></span><span><span data-i18n="hero.f2"></span><small data-i18n="hero.f2s"></small></span></div>
        </div>
      </div>
    </section>

    <!-- ===== TRUST BAR ===== -->
    <div class="trust-bar">
      <div class="container">
        <span class="trust-label" data-i18n="trust.title"></span>
        <div class="cert-list">
          <span>ISO 9001</span><span>CE</span><span>EN 15194</span><span>3C</span><span>RoHS</span><span>OEM / ODM</span>
        </div>
      </div>
    </div>

    <!-- ===== FEATURES ===== -->
    <section>
      <div class="container">
        <div class="section-head">
          <span class="eyebrow" data-i18n="feat.eyebrow"></span>
          <h2 data-i18n="feat.title"></h2>
          <p data-i18n="feat.desc"></p>
        </div>
        <div class="features-grid">
          <div class="feature-card"><div class="feature-icon" id="fi1"></div><h3 data-i18n="feat.1t"></h3><p data-i18n="feat.1d"></p></div>
          <div class="feature-card"><div class="feature-icon" id="fi2"></div><h3 data-i18n="feat.2t"></h3><p data-i18n="feat.2d"></p></div>
          <div class="feature-card"><div class="feature-icon" id="fi3"></div><h3 data-i18n="feat.3t"></h3><p data-i18n="feat.3d"></p></div>
          <div class="feature-card"><div class="feature-icon" id="fi4"></div><h3 data-i18n="feat.4t"></h3><p data-i18n="feat.4d"></p></div>
        </div>
      </div>
    </section>

    <!-- ===== PRODUCTS ===== -->
    <section class="section-alt">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow" data-i18n="prod.eyebrow"></span>
          <h2 data-i18n="prod.title"></h2>
          <p data-i18n="prod.desc"></p>
        </div>
        <div class="products-grid" id="featured-grid"></div>
        <div class="text-center mt-40"><a href="products.html" class="btn btn-dark" data-i18n="prod.all"></a></div>
      </div>
    </section>

    <!-- ===== PROCESS ===== -->
    <section>
      <div class="container">
        <div class="section-head">
          <span class="eyebrow" data-i18n="proc.eyebrow"></span>
          <h2 data-i18n="proc.title"></h2>
          <p data-i18n="proc.desc"></p>
        </div>
        <div class="process-grid">
          <div class="process-step"><div class="step-num">1</div><h4 data-i18n="proc.1t"></h4><p data-i18n="proc.1d"></p></div>
          <div class="process-step"><div class="step-num">2</div><h4 data-i18n="proc.2t"></h4><p data-i18n="proc.2d"></p></div>
          <div class="process-step"><div class="step-num">3</div><h4 data-i18n="proc.3t"></h4><p data-i18n="proc.3d"></p></div>
          <div class="process-step"><div class="step-num">4</div><h4 data-i18n="proc.4t"></h4><p data-i18n="proc.4d"></p></div>
          <div class="process-step"><div class="step-num">5</div><h4 data-i18n="proc.5t"></h4><p data-i18n="proc.5d"></p></div>
        </div>
      </div>
    </section>

    <!-- ===== SUCCESS STORY / PAKISTAN ===== -->
    <section class="section-alt">
      <div class="container">
        <div class="split">
          <div class="split-visual">
            <img src="images/client-pakistan-1.jpg" alt="JNX client partnership in Pakistan" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">
            <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,29,46,.05),rgba(8,29,46,.55))"></div>
            <div class="badge-float" style="z-index:2"><div><strong data-i18n="case.badge"></strong><span data-i18n="case.tag"></span></div></div>
          </div>
          <div class="split-content">
            <span class="eyebrow" data-i18n="case.eyebrow"></span>
            <h2 data-i18n="case.title"></h2>
            <p data-i18n="case.desc"></p>
            <ul class="check-list">
              <li><span id="ci1"></span><span><b data-i18n="case.p1"></b><br><small style="color:var(--muted)" data-i18n="case.p1s"></small></span></li>
              <li><span id="ci2"></span><span><b data-i18n="case.p2"></b><br><small style="color:var(--muted)" data-i18n="case.p2s"></small></span></li>
              <li><span id="ci3"></span><span><b data-i18n="case.p3"></b><br><small style="color:var(--muted)" data-i18n="case.p3s"></small></span></li>
            </ul>
            <a href="about.html" class="btn btn-dark" style="margin-top:12px" data-i18n="about.learn"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== ABOUT TEASER ===== -->
    <section>
      <div class="container">
        <div class="split">
          <div class="split-content">
            <span class="eyebrow" data-i18n="about.eyebrow"></span>
            <h2 data-i18n="about.title"></h2>
            <p data-i18n="about.desc"></p>
            <ul class="check-list">
              <li><span id="ai1"></span><span data-i18n="about.c1"></span></li>
              <li><span id="ai2"></span><span data-i18n="about.c2"></span></li>
              <li><span id="ai3"></span><span data-i18n="about.c3"></span></li>
              <li><span id="ai4"></span><span data-i18n="about.c4"></span></li>
            </ul>
            <a href="about.html" class="btn btn-dark" style="margin-top:12px" data-i18n="about.learn"></a>
          </div>
          <div class="split-visual">
            <img src="images/bikes2w_collection.jpg" alt="JNX Electric Two-Wheeler Collection" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">
            <div class="badge-float" style="z-index:2"><div><strong>2026</strong><span data-i18n="about.badge"></span></div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== CTA ===== -->
    <section class="cta-band" style="padding-block:64px">
      <div class="container cta-inner">
        <div>
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.desc"></p>
        </div>
        <a href="contact.html" class="btn btn-primary btn-lg" data-i18n="cta.btn"></a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    // 填充图标
    document.addEventListener('DOMContentLoaded', function(){
      ['fi1','fi2','fi3','fi4'].forEach((id,i)=>{
        const el=document.getElementById(id); if(el) el.innerHTML=[ICONS.factory,ICONS.settings,ICONS.shield,ICONS.truck][i];
      });
      ['ci1','ci2','ci3'].forEach((id,i)=>{
        const el=document.getElementById(id); if(el){ el.className=''; el.innerHTML=ICONS.check; }
      });
      ['ai1','ai2','ai3','ai4'].forEach(id=>{
        const el=document.getElementById(id); if(el){ el.className=''; el.innerHTML=ICONS.check; }
      });
    });
  </script>
</body>
</html>
