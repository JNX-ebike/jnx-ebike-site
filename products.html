<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | JNX EBIKE — Electric Two-Wheeler & Three-Wheeler</title>
  <meta name="description" content="Explore JNX EBIKE's full range of 50+ electric two-wheeler models and 19 electric three-wheeler models. All models support OEM/ODM customization.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><a href="index.html" data-i18n="ph.home"></a> / <span data-i18n="ph.products"></span></div>
        <h1 data-i18n="nav.products"></h1>
        <p data-i18n="prod.desc"></p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all" data-i18n="pl.all"></button>
          <button class="filter-btn" data-filter="2w" data-i18n="pl.2w"></button>
          <button class="filter-btn" data-filter="passenger" data-i18n="pl.passenger"></button>
          <button class="filter-btn" data-filter="cargo" data-i18n="pl.cargo"></button>
        </div>
        <p style="text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:28px" data-i18n="pl.hint"></p>
        <div class="products-grid" id="all-products-grid"></div>
      </div>
    </section>

    <section class="cta-band" style="padding-block:60px">
      <div class="container cta-inner">
        <div><h2 data-i18n="cta.title"></h2><p data-i18n="cta.desc"></p></div>
        <a href="contact.html" class="btn btn-primary btn-lg" data-i18n="cta.btn"></a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
